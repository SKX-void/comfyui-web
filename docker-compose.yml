# =============================================================================
# comfyui-server —— 单文件产物 + 官方 node 镜像，不需要 Dockerfile、不需要 npm install
#
# 前置（在宿主机执行一次）：
#   pnpm install && pnpm build        # → dist/{server.mjs, web/, templates/}
#   mkdir -p data                     # 必须！否则 docker 会以 root 建目录，
#                                     # 容器里用 ${UID} 跑就写不进去（SQLite 直接报错）
#   docker compose up -d
#
# 配置走**文件模式**：docker/config.json 挂到 /app/config.json，
# 所以这里不需要一长串环境变量（环境变量仍可用作临时覆盖，优先级更高）。
#
# 改了代码：pnpm build && docker compose restart comfyui-server
# =============================================================================
name: comfyui-server

services:
  comfyui-server:
    # 任何 Node >= 24 的镜像都行（node:sqlite 无 flag 可用是硬要求）
    image: node:26.7.0-alpine3.24
    container_name: comfyui-server
    restart: on-failure:3
    working_dir: /app
    # 以宿主机用户身份运行，./data 里生成的文件才不会变成 root 所有
    user: "${UID:-1000}:${GID:-1000}"
    # 让 node 之外的合法 init 当 PID 1：正确转发 SIGTERM（本服务有优雅关闭）
    init: true
    networks:
      - server-net

    environment:
      # 产物里已经固化了 NODE_ENV=production，这里写出来只是让 compose 自解释
      NODE_ENV: production
      TZ: Asia/Shanghai # 日志时间用的时区（系统级，不属于应用配置）

    ports:
      # 宿主机端口可用 HOST_PORT 覆盖（本机 8086 被开发服务器占用时）
      - "${HOST_PORT:-8086}:8086"

    volumes:
      # 构建产物（只读）：server.mjs + web/ + templates/。
      # 前端目录固定为 <server.mjs 所在目录>/web，模板同理（版本锁定的代码资产），
      # 所以 /app 一个挂载点就够，不需要单独挂 templates。
      - ./dist:/app:ro
      # 容器配置（只读）。用仓库里的文件而不是让 docker 现场创建，
      # 避免"源文件不存在时 docker 建出同名目录 → 启动报 EISDIR"这种坑。
      - ./docker/config.json:/app/config.json:ro
      # 运行期数据（可写）：SQLite + 缩略图缓存（见 config.json 的 dataDir / cacheDir）
      - ./data:/data

    command: >
      sh -c 'if [ ! -f /app/server.mjs ]; then
        echo "[comfyui-server] 找不到 /app/server.mjs —— 请在宿主机先执行 pnpm build（产物在 ./dist）";
        exit 1;
      fi;
      if [ ! -f /app/config.json ]; then
        echo "[comfyui-server] 找不到 /app/config.json —— 检查 ./docker/config.json 是否存在";
        exit 1;
      fi;
      exec node /app/server.mjs'

    healthcheck:
      # 8086 是**容器内**端口（= docker/config.json 的 port），改端口时三处一起改：
      # config.json / ports / 这里。busybox wget 在 alpine 镜像里自带，不用额外装东西。
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8086/api/system/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # 请求日志会一直写，限制单文件大小与数量，别把磁盘吃满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  server-net:
    external: true
