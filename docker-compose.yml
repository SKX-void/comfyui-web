# =============================================================================
#   docker-compose.yml —— 部署单元（本文件与 dist/ 的**内容**同层）
#
#   部署机上没有仓库源码，只有从 dist/ 拷出来的这三份：
#
#     <部署目录>/
#     ├── docker-compose.yml   ← 本文件
#     ├── app/                 ← dist/app  （server.mjs + web/，只读挂载）
#     ├── tabs/                ← dist/tabs （插件交付物，只读挂载）
#     └── data/                ← dist/data （空目录；唯一可写：host.json + 插件空间）
#
#     cp -r dist/app dist/tabs dist/data <部署目录>/   # dist/data 本来就是空的
#
#   容器里的布局是**平的**（不套 /app/dist/*）：
#     ./app → /app（只读）  ./tabs → /tabs（只读）  ./data → /data（可写）
#   配套 REPO_ROOT=/：宿主按 repoRoot 解析 tabsDir=/tabs、dataDir=/data，
#   而 webDir 取 server.mjs 的同级目录 = /app/web（见 apps/server/src/config.ts）。
#
#   docker compose up -d
#
# 更新部署：宿主机 pnpm build → 覆盖部署目录的 app/（与 tabs/）→ docker compose restart
# 加插件：改 plugins/* 源码 → pnpm build → 覆盖 dist/tabs → restart（宿主产物与插件无关）
# =============================================================================
name: comfyui-web

services:
  comfyui-web:
    # 任何 Node >= 24 的镜像都行（node:sqlite 无 flag 可用是硬要求）
    image: node:26.7.0-alpine3.24
    container_name: comfyui-web
    restart: on-failure:3
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    # 让 node 之外的合法 init 当 PID 1：正确转发 SIGTERM（宿主有优雅关闭）
    init: true
    networks:
      - server-net

    environment:
      TZ: Asia/Shanghai # 日志时间用的时区（系统级，不属于应用配置）
      NODE_ENV: production # 生产日志走 JSON（关掉 pino-pretty 那条可选路径）
      # 日志的两个临时旋钮（见 docs/config.md §1）：级别 fatal/error/warn/info/debug/trace/silent，
      # 格式 default | text | json（text = 宿主自带、不依赖 pino-pretty，容器里推荐）。
      # 请求级日志在 debug；写错不致命 —— 回落默认值并在启动日志里 warn。
      # COMFYUI_WEB_LOG_LEVEL: debug
      # COMFYUI_WEB_LOG_FORMAT: text
      REPO_ROOT: / # 三个挂载点都在根上：tabsDir=/tabs、dataDir=/data

    volumes:
      - ./app:/app:ro # 宿主产物：server.mjs + web/
      - ./tabs:/tabs:ro # 插件交付物（宿主只读，从不写）
      - ./data:/data # 唯一可写卷：host.json + data/plugins/<包名>/

    command: >
      sh -c 'if [ ! -f /app/server.mjs ]; then
        echo "[comfyui-web] 找不到 /app/server.mjs —— 这边要的是 dist/ 里的内容（app/ tabs/ data/），先跑 pnpm build 再拷过来";
        exit 1;
      fi;
      exec node /app/server.mjs'

    healthcheck:
      # 8087 是**容器内**端口（= ./data/host.json 的 port）。本服务不发布 ports，只在
      # server-net 上由 nginx 反代；要直连宿主机就加 ports: ["8087:8087"]。
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8087/api/host >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # 请求日志会一直写，限制单文件大小与数量，别把磁盘吃满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  server-net:
    external: true
