packages:
  - 'apps/*'
  - 'packages/*'
  # v2 插件源码：宿主**不**导入它们，只提供构建与本地 link 安装的落脚点。
  # profile 侧（profiles/<name>/）是一个独立 workspace，插件经 link: 装进去。
  - 'plugins/*'

# esbuild 需要 postinstall 才能就位（tsx / vite 都依赖它）
allowBuilds:
  esbuild: true

# store 放仓库内：本环境 HOME 是只读挂载，默认 store 路径不可写。
# 若你的机器 HOME 可写，可删掉这一行以复用全局 store。
storeDir: .pnpm-store
