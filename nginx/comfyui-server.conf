# =============================================================================
# comfyui-server 反向代理（**只有 server 块**，可直接丢进 conf.d/）
#
#   cp nginx/comfyui-server.conf /etc/nginx/conf.d/comfyui-server.conf
#   nginx -t && nginx -s reload
#
# 上游 = 单文件产物自己监听的端口（config.json 的 port，默认 8086）。
# 三个要点：
#   1) SSE（/api/jobs/<id>/events）显式关掉代理缓冲 —— 应用自己也会发
#      X-Accel-Buffering: no，nginx 默认认这个头，所以不加这段通常也能跑；
#      但中间多一层代理、有人 proxy_ignore_headers、或头被吞掉时进度就会卡死，
#      所以这段是兜底，别省（实测差异见下面 SSE 那段注释）
#   2) 请求体上限要比应用侧的 256 KB 略大，这样用户看到的是应用返回的中文
#      413 提示，而不是 nginx 那张 HTML 错误页
#   3) vite 产物文件名带内容哈希，/assets/ 可以放心长缓存（应用自己发的是
#      max-age=0，绕不过 nginx 就是每次都 304）
# =============================================================================

server {
    # 手机访问的入口（你原来的拓扑是 5173 反代到 5180，这里可以直接接管）。
    # 8189 若已被占用就改一个；用域名/HTTPS 访问时在 listen 后面加 ssl 并补证书路径。
    listen 8189;
    # listen    [::]:8189;
    server_name _; # 用域名访问改成你的域名

    # 请求体上限：应用侧是 256 KB（safety/quota.ts），这里留一点余量
    client_max_body_size 512k;

    # 常规接口都很快（应用侧访问 ComfyUI 的超时是 30s），120s 足够
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # 让应用日志里的来源 IP 有意义（排查"谁提交的"时用得上）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    set $backend_url http://comfyui-server:8086;

    # 以后要加鉴权，就打开这两行（生成密码：htpasswd -c /etc/nginx/.htpasswd 用户名）
    # auth_basic           "comfyui-server";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # -------------------------------------------------------------------------
    # 任务进度流（SSE）：任务进度卡不卡，全看这一段
    #
    # 实测（本机 nginx 1.22 + 同一个后端，任务跑 5s，连上后 2s 看收到多少字节）：
    #   · 普通 location（默认 proxy_buffering on，上游头正常传递）→ 131 B 实时到达
    #     —— 因为应用发了 X-Accel-Buffering: no，nginx 默认认它
    #   · 普通 location + proxy_ignore_headers X-Accel-Buffering → **0 B**（卡住）
    #   · 下面这段 + 同样忽略那个头 → 133 B 实时到达
    # 结论：应用那个头能顶大部分场景，这里显式关缓冲是兜底 —— 别删。
    # -------------------------------------------------------------------------
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass $backend_url;

        proxy_http_version 1.1;
        proxy_set_header Connection ""; # 1.1 + 清空 Connection，上游才能长连接
        proxy_buffering off;
        proxy_cache off;
        gzip off; # 压缩会攒够一块才吐，进度就不实时了

        proxy_read_timeout 1h; # 长连接，靠心跳保活
        proxy_send_timeout 1h;
    }

    # -------------------------------------------------------------------------
    # 前端静态资源：文件名是内容哈希（index-XXXX.js），改缓存策略不会串版本
    # -------------------------------------------------------------------------
    location /assets/ {
        proxy_pass $backend_url;

        # 先盖掉上游的 Cache-Control，否则会同时出现两个 Cache-Control 头
        proxy_hide_header Cache-Control;
        expires 30d;
    }

    # 其余全部转给上游：/api/* 是接口，其它路径由应用的 SPA 回退处理
    # （index.html 不带哈希，保持应用发来的 max-age=0，每次校验，避免壳子过期）
    location / {
        proxy_pass $backend_url;
    }
}

# 如果 nginx 和 comfyui-server 都在 server-net 这个 docker 网络里：
#   把上面三处 proxy_pass 改成 http://comfyui-server:8086;
#   （容器里的 nginx 用 127.0.0.1 够不到宿主机的端口映射）
